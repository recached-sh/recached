<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-labelledby="t d">
<title id="t">Recached architecture</title>
<desc id="d">Your database stays the source of truth. Your backend publishes committed state to the Recached server over RESP on port 6379. Browser, Android and Apple, and Rust service clients sync with the server over WebSocket on port 6380 and read from a local cache. The mobile SDKs are previews.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}</style>
