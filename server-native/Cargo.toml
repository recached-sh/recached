[package]
# The crate is `recached` and the binary it installs is `recached-server`, which
# is what the README, the Homebrew formula and the Docker image have always
# said. The package was `server-native` and produced a `server-native` binary,
# so `cargo install recached` installed nothing (the name was unregistered) and
# `cargo build --bin recached-server` failed outright; only Docker and brew
# worked, because both rename the artefact as they copy it. The directory keeps
# its name — it describes the role, the package describes the product.
name    = "recached"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Recached cache server: an in-memory key-value store with a Redis-compatible RESP command subset, plus WebSocket sync for browser, mobile, and embedded Rust clients."
repository.workspace = true
# Not publishable to crates.io: this crate depends on `core-engine` by path, and a
# path dependency carries no version, which crates.io rejects. Stated rather than
# left for `cargo publish` to discover. Does not affect `cargo install --git`,
# which is how the server is distributed. Remove this — and give the workspace
# path dependencies versions — if these are ever published.
publish = false

[[bin]]
name = "recached-server"
path = "src/main.rs"

[dependencies]
core-engine.workspace              = true
tokio.workspace                    = true
tokio-tungstenite.workspace        = true
futures-util.workspace             = true
tracing.workspace                  = true
tracing-subscriber.workspace       = true
metrics.workspace                  = true
metrics-exporter-prometheus.workspace = true
tokio-rustls.workspace             = true
serde.workspace                    = true
rmp-serde.workspace                = true
socket2.workspace                  = true
num_cpus.workspace                 = true
hmac.workspace                     = true
sha2.workspace                     = true
base64.workspace                   = true
rand.workspace                     = true

# jemalloc does not build under MSVC (its C build needs a Unix-like toolchain),
# so it is only pulled in off-MSVC; Windows MSVC uses the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace        = true

[lints]
workspace = true
