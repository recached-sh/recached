<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" role="img" aria-label="Backend RESP clients connect to the Recached server on port 6379. Browser, native Android and Apple apps, and embedded Rust services sync over WebSocket on port 6380 and read local memory.">
<title>Recached server and local client caches</title>
<desc>Backend RESP clients connect to the Recached server on port 6379. Browser, native Android and Apple apps, and embedded Rust services sync over WebSocket on port 6380 and read local memory. Mobile SDKs are implemented previews.</desc>
<style>
  .wire { fill:none; stroke:#2b3648; stroke-width:2; }
  .node { fill:#131b2a; stroke:#2b3648; stroke-width:1.5; }
  .server { stroke:#E8542A; }
  .pill { fill:#0f1620; stroke:#2b3648; }
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-anchor:middle; }
  .title { fill:#e6edf3; font-size:16px; font-weight:700; }
  .sub { fill:#93a1b5; font-size:12px; }
  .code { fill:#e6edf3; font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .label { fill:#93a1b5; font-size:12px; font-weight:600; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#2b3648" stroke-width="1.5"/></marker></defs>
<path class="wire" d="M190 190 H320" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="wire" d="M530 190 H625 M625 80 V300 M625 80 H710 M625 190 H710 M625 300 H710"/>
<path class="wire" d="M635 80 H704" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="wire" d="M635 190 H704" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="wire" d="M635 300 H704" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="node" x="20" y="149" width="170" height="82" rx="14"/>
<text x="105" y="182" class="title">Your backend</text><text x="105" y="207" class="sub">RESP clients</text>
<text x="255" y="174" class="label">RESP :6379</text>
<rect class="node server" x="320" y="123" width="210" height="134" rx="16"/>
<text x="425" y="153" class="title">Recached server</text>
<rect class="pill" x="338" y="168" width="174" height="28" rx="7"/><text x="425" y="187" class="code">server-native</text>
<rect class="pill" x="338" y="207" width="174" height="28" rx="7"/><text x="425" y="226" class="code">core-engine</text>
<text x="620" y="24" class="label">WebSocket :6380</text>
<text x="620" y="43" class="sub">writes + updates</text>
<rect class="node" x="710" y="32" width="306" height="96" rx="14"/>
<text x="863" y="58" class="title">Browser</text><text x="863" y="80" class="code">wasm-edge + sync-client</text>
<text x="863" y="103" class="sub">Local WASM reads · optional IndexedDB</text>
<rect class="node" x="710" y="142" width="306" height="96" rx="14"/>
<text x="863" y="168" class="title">Android / iOS / macOS</text><text x="863" y="190" class="code">recached-mobile + sync-client</text>
<text x="863" y="213" class="sub">Native reads · SQLite · Kotlin / Swift previews</text>
<rect class="node" x="710" y="252" width="306" height="96" rx="14"/>
<text x="863" y="278" class="title">Rust service</text><text x="863" y="300" class="code">recached-embed + sync-client</text>
<text x="863" y="323" class="sub">Local native reads · in-memory outbox</text>
<text x="520" y="371" class="sub">Every runtime shares core-engine; client reads stay in local memory.</text>
</svg>
