[package]
name    = "wasm-edge"
version.workspace = true
edition.workspace = true
# Spelled out rather than inherited: wasm-pack parses this manifest itself, and
# every field it reads ends up in the generated npm package.json. `description`
# and `repository` were absent, so the published recached-edge package carried
# neither — wasm-pack warns about exactly this on every build.
license = "Apache-2.0"
description = "The Recached cache engine compiled to WebAssembly: a local in-memory browser cache with optional IndexedDB persistence and WebSocket sync to a Recached server."
repository.workspace = true
# Publishes to **npm** as `recached-edge`, never to crates.io: it depends on
# `core-engine` by path, and a path dependency carries no version, which
# crates.io rejects. `wasm-pack` is unaffected — it reads the fields above and
# does not consult `publish`.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core-engine.workspace    = true
sync-client.workspace    = true
wasm-bindgen.workspace   = true
wasm-bindgen-futures     = "0.4"
js-sys.workspace         = true

[dependencies.web-sys]
workspace = true
features = [
    "WebSocket",
    # WebSocket.binaryType, so binary frames arrive as ArrayBuffer rather than
    # a Blob that would need an async read.
    "BinaryType",
    "BroadcastChannel",
    "MessageEvent",
    "ErrorEvent",
    "console",
    # Window.setTimeout, for reconnect backoff.
    "Window",
]

# getrandom v0.3 requires explicit opt-in for wasm32-unknown-unknown to use
# the JS globalThis.crypto backend (pulled transitively via rand in core-engine).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

# Browser-only tests: the IndexedDB persistence paths cannot run on a native
# target. Run with `wasm-pack test --headless --chrome wasm-edge`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Recent Rust toolchains emit newer wasm features (bulk-memory, nontrapping
# float-to-int, …) that the older `wasm-opt` wasm-pack downloads rejects during
# validation. Disabling wasm-opt avoids the version mismatch entirely; the
# release build is already optimized by rustc's release profile, so the size
# difference is small. Re-enable with an up-to-date wasm-opt if desired.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[lints]
workspace = true
