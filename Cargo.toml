[workspace]
members = [
    "core-engine",
    "server-native",
    "sync-client",
    "recached-embed",
    "wasm-edge",
]
resolver = "2"

# ── Single source of truth for all crate versions ────────────────────────────
# Members inherit with:  version.workspace = true  /  edition.workspace = true
[workspace.package]
version = "0.3.5"
edition = "2024"
license = "Apache-2.0"
authors = ["ThinkGrid Labs"]
repository = "https://github.com/recached-sh/recached.git"

# ── Shared dependency versions ────────────────────────────────────────────────
# Members inherit with:  tokio.workspace = true  (add features per-crate if needed)
[workspace.dependencies]
# internal
core-engine = { path = "core-engine" }
sync-client = { path = "sync-client" }
dashmap        = "6"
indexmap       = "2"
rand           = { version = "0.9", features = ["thread_rng"] }
smallvec       = "1"

# async runtime
tokio          = { version = "1",     features = ["full"] }
tokio-tungstenite = "0.29.0"
futures-util   = "0.3"

# observability
tracing                      = "0.1"
tracing-subscriber           = { version = "0.3", features = ["env-filter"] }
metrics                      = "0.24"
metrics-exporter-prometheus  = { version = "0.16", features = ["http-listener"] }
tokio-rustls                 = "0.26"

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde  = "1"

# sync-scope tokens
hmac   = "0.12"
sha2   = "0.10"
base64 = "0.22"

# wasm
wasm-bindgen = "0.2.92"
js-sys       = "0.3.69"
web-sys      = "0.3.69"

# perf
socket2           = { version = "0.5", features = ["all"] }
num_cpus          = "1"
tikv-jemallocator = "0.6"

# ── Lints ─────────────────────────────────────────────────────────────────────
# CI runs `cargo clippy --all-targets --all-features -D warnings`, so anything
# set to `warn` here is a hard failure there. Only lints the workspace actually
# satisfies are enabled; the rest are listed below as the ratchet, with their
# real cost, rather than switched on to be immediately suppressed.
#
# Members inherit with `[lints] workspace = true`.
[workspace.lints.rust]
# Production code has none. The four test sites that legitimately need it (a
# counting `GlobalAlloc`, and `env::set_var`, which edition 2024 made unsafe)
# carry an explicit `#[allow(unsafe_code)]` with a reason — which is the point:
# each one is now a decision on the record instead of an absence of policy.
unsafe_code      = "deny"
unused_must_use  = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all        = { level = "warn", priority = -1 }
mem_forget = "deny"
todo       = "warn"
dbg_macro  = "warn"

# ── The ratchet ───────────────────────────────────────────────────────────────
# These are the rules this codebase already follows in production and cannot
# yet enforce, because `[lints]` applies to tests too and the test suites use
# every one of them deliberately. Measured on the 0.3.2 tree:
#
#   indexing_slicing            411   mostly `arr[1]` after a `need!(n)` guard
#   unwrap_used / expect_used   417   overwhelmingly in tests
#   panic                        99   test assertions
#   cast_* family                78
#
# Turning them on means either 1,000 `#[allow]`s or a real audit of each site.
# The audit is the plan — per crate, starting with `core-engine`, replacing
# `arr[i]` with `get(i)` where the guard is not adjacent — and each crate flips
# its own lint from `allow` to `warn` in `[lints.clippy]` as it lands. Enabling
# them here first would only mean suppressing them everywhere, which enforces
# nothing and hides the next real one.

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
# On by default only in debug builds, where an overflow panics and a release
# build silently wraps — two behaviours from one line of code. A cache doing
# arithmetic on client-supplied numbers wants the panic in both.
overflow-checks = true
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
