[package]
name    = "core-engine"
description = "The shared Recached cache engine: RESP parsing, typed commands, a sharded in-memory store, TTLs, collections, JSON, and eviction. Used by the server and every client adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
# Not publishable to crates.io: this crate is consumed by path from every other crate in the
# workspace, none of which can publish, so publishing it alone serves nothing. Stated rather than
# left for `cargo publish` to discover. Does not affect `cargo install --git`,
# which is how the server is distributed. Remove this — and give the workspace
# path dependencies versions — if these are ever published.
publish = false

[dependencies]
dashmap.workspace = true
indexmap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true

# `SystemTime::now()` is unsupported on wasm32-unknown-unknown and panics. This
# crate is compiled into the browser SDK, so it needs the platform clock there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[dev-dependencies]
# Snapshot back-compatibility tests need to write a pre-0.2.2 snapshot, where
# values were msgpack strings rather than binary.
rmp-serde.workspace = true

[lints]
workspace = true
