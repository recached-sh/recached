name: Continuous Integration

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  # Callable so the release workflow gates on the *same* checks rather than a
  # re-declared subset that can drift out of step with this file.
  workflow_call:

# Declared explicitly: with no `permissions` block a workflow inherits the
# repository default, which may be write. Nothing in CI needs more than read.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  supply-chain:
    name: Advisories, Licences, and Bans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-deny

      # `cargo deny` covers what `cargo audit` does (RustSec advisories) and
      # adds licence and duplicate-version policy, so it is the single gate
      # rather than running both. Configured in deny.toml.
      - name: cargo-deny
        run: cargo deny --all-features check

  quality-checks:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # Version, components and profile all come from rust-toolchain.toml,
        # so CI cannot silently drift onto a newer compiler than the one
        # this repo was linted against.
        run: |
          rustup show
          rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "recached-ci-cache"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # wasm-edge builds natively, so its pure logic is linted and unit-tested
        # here. Its browser-bound paths (WebSocket, IndexedDB, Closure plumbing)
        # are NOT covered by any automated test yet — the npm workflow only
        # builds the wasm package. See the roadmap for wasm-bindgen-test.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      # The `recached-embed` and `recached-mobile` live suites skip themselves
      # unless these are set, so without a server they silently test nothing —
      # which is exactly what the embed suite did when the crate first landed.
      # Boot one and point both at the socket.
      - name: Build the server for the live client suites
        run: cargo build --locked -p recached --bin recached-server

      - name: Run the embedded and mobile client suites against a live server
        env:
          RECACHED_EMBED_TEST_URL: ws://127.0.0.1:6380
          RECACHED_MOBILE_TEST_URL: ws://127.0.0.1:6380
          RECACHED_SAVE_INTERVAL: "0"
        run: |
          ./target/debug/recached-server &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if nc -z 127.0.0.1 6380; then break; fi
            sleep 0.2
          done
          nc -z 127.0.0.1 6380 || { echo "server never opened 6380"; exit 1; }
          cargo test --locked -p recached-embed --test live
          cargo test --locked -p recached-mobile --test live

      # core-engine is the shared state machine: the same code evaluates commands
      # on the server and inside the browser via WASM, so a bug here reaches every
      # platform at once. Its coverage is gated rather than merely reported.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-llvm-cov

      - name: Enforce core-engine coverage floor (90%)
        run: cargo llvm-cov -p core-engine --summary-only --fail-under-lines 90

      # The server crate is mostly async I/O drivers — accept loops, TLS handshakes,
      # replication streams — which are exercised by the socket-driven tests
      # rather than unit tests. The floor is set to protect the pure decision
      # functions (scope classification, wire encoding, config parsing), not to
      # chase a number the I/O layer cannot reach.
      - name: Enforce recached (server) coverage floor (65%)
        run: cargo llvm-cov -p recached --summary-only --fail-under-lines 65 -- --include-ignored

  # ---------------------------------------------------------------------------
  # Browser tests — the IndexedDB persistence layer and the engine's behaviour
  # on a real wasm32 target. Native tests cannot cover either: `wasm-pack test`
  # runs them in headless Chrome with a real IndexedDB.
  #
  # This job exists because a native-only suite missed that `SystemTime::now()`
  # panics on wasm32-unknown-unknown, which made every browser store write abort.
  # ---------------------------------------------------------------------------
  browser-tests:
    name: Browser Tests (wasm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # Version, components and profile all come from rust-toolchain.toml,
        # so CI cannot silently drift onto a newer compiler than the one
        # this repo was linted against.
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "recached-wasm-cache"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pinned deliberately. Left unset, the action resolves "latest" through
          # the GitHub API and silently falls back to a much older wasm-pack when
          # that call is rate-limited — and versions before workspace inheritance
          # cannot parse `license.workspace = true`, failing the build with
          # "invalid type: map, expected a string for key `package.license`".
          # That is why this passed for months and then broke on an unrelated run.
          version: 'v0.15.0'

      # The runner ships Chrome and a matching chromedriver on PATH. Letting
      # wasm-pack download its own risks a version mismatch with the installed
      # browser, which fails as an opaque driver crash.
      - name: Use the runner's chromedriver
        run: |
          echo "CHROMEDRIVER=$(which chromedriver)" >> "$GITHUB_ENV"
          chromedriver --version
          google-chrome --version

      - name: Run browser tests
        run: wasm-pack test --headless --chrome wasm-edge

  # Builds the npm package the way the release does, packs a tarball, and
  # imports it from outside the working tree. Typecheck and unit tests both
  # pass against a tree where `pkg/snippets/` sits on disk, so neither can see
  # that it never ships — which is how 0.1.3 through 0.3.0 all published a
  # package that threw ERR_MODULE_NOT_FOUND on import.
  npm-package:
    name: Package Installability (recached-edge)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # Version, components and profile all come from rust-toolchain.toml,
        # so CI cannot silently drift onto a newer compiler than the one
        # this repo was linted against.
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "recached-wasm-cache"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pinned for the same reason as browser-tests above.
          version: 'v0.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Build the package
        run: cd wasm-edge && npm install && npm run build

      # Checks sdk.ts against the REAL generated bindings. The typecheck-js job
      # cannot do this — it stubs pkg/*.d.ts because wasm-pack isn't installed
      # there — and `createCache` casts through `unknown`, so nothing else does
      # either. That blind spot shipped `incr`/`decr` broken for six releases.
      - name: Typecheck against generated bindings
        run: cd wasm-edge && npm run typecheck:bindings

      # The SDK unit tests run here rather than in typecheck-js because this is
      # the job with a real wasm-pack build: their typecheck pass resolves the
      # generated bindings, not the stub .d.ts that job fabricates.
      - name: Test recached-edge SDK
        run: cd wasm-edge && npm test

      - name: Verify the tarball is installable and works
        run: cd wasm-edge && npm run verify

  integration-load-chaos:
    name: Load & Chaos Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # Version, components and profile all come from rust-toolchain.toml,
        # so CI cannot silently drift onto a newer compiler than the one
        # this repo was linted against.
        run: |
          rustup show
          rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "recached-ci-cache"

      - name: Run load & chaos tests
        run: cargo test -p recached -- --include-ignored
        timeout-minutes: 5

  typecheck-js:
    name: Typecheck & Test @recached/react and @recached/vue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 22.x, not 20.x: jsdom 30 declares `node ^22.22.2 || ^24.15.0 || >=26`
      # and its bundled undici needs `>=22.19.0` for `markAsUncloneable`. npm
      # does not enforce `engines`, so on Node 20 the install succeeded and the
      # suite died at import with `webidl.util.markAsUncloneable is not a
      # function`. Node 20 is also past end-of-life.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Generate SDK type declarations
        run: |
          cd wasm-edge && npm install
          # wasm-pack isn't available in this job, so create a minimal stub that
          # satisfies the TypeScript import so tsc can emit sdk.d.ts for downstream packages.
          mkdir -p pkg
          node -e "
            require('fs').writeFileSync('pkg/recached_edge.d.ts',
              'export class RecachedCache {}\nexport default function init(): Promise<void>;\n'
            );
          "
          npx tsc

      - name: Install @recached/react dependencies
        run: cd sdks/recached-react && npm install --legacy-peer-deps

      - name: Typecheck @recached/react
        run: cd sdks/recached-react && npm run typecheck

      # The hooks need no wasm — the suite fakes `Cache` and aliases the
      # `recached-edge` peer to a stub, so it runs in this job rather than the
      # one that builds the engine.
      - name: Test @recached/react
        run: cd sdks/recached-react && npm test

      - name: Install @recached/vue dependencies
        run: cd sdks/recached-vue && npm install --legacy-peer-deps

      - name: Typecheck @recached/vue
        run: cd sdks/recached-vue && npm run typecheck

      - name: Test @recached/vue
        run: cd sdks/recached-vue && npm test

  # ── Mobile ──────────────────────────────────────────────────────────────────
  # The same packaging scripts the release runs, so a change that breaks the
  # Android or Apple build fails here rather than on a release tag. Built
  # without LTO and with parallel codegen: these jobs prove the build, not
  # ship it, and the release profile would triple their time.

  mobile-android:
    name: Mobile — Android libraries and Kotlin bindings
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain and Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "recached-mobile-android"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-ndk

      # The runner image ships an NDK; ANDROID_NDK_LATEST_HOME points at it.
      - name: Build and package
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" recached-mobile/scripts/build-android.sh

  mobile-apple:
    name: Mobile — XCFramework and Swift bindings
    runs-on: macos-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "recached-mobile-apple"

      - name: Build and package
        run: recached-mobile/scripts/build-apple.sh

      - name: Consume the XCFramework on macOS and the iOS simulator
        run: recached-mobile/scripts/check-apple.sh
